  summary: >
    AI Engineer at Viettel Cyber Security and research member at the BKAI NLP Lab, HUST.
    I work on low-resource neural machine translation, knowledge distillation into small
    language models, and the design of AI agents that people can safely work alongside.

  # Phone number is intentionally omitted from the website; it is on the CV PDF only.

  social_networks:
    - network: GitHub
      username: Ttdne
    - network: LinkedIn
      username: ttdne

  address:
    city: Ha Noi
    countryCode: VN

  sections:
    Experience:
      - company: Viettel Cyber Security, Viettel Group
        position: AI Engineer (promoted prior to graduation)
        location: Ha Noi, Viet Nam
        start_date: 2026-03-01
        highlights:
          - "**Human–Agent Collaboration Platform (internal pilot):** designed the orchestration architecture for a SOC coworking platform where human analysts and AI agents work as equal partners, supporting two-way task assignment and peer review."
          - "**RINA Expert (Best Innovation Idea of the Year):** fine-tuned Small Language Models (SLMs) for threat-hunting tasks, enabling lightweight and secure local execution in air-gapped environments."

      - company: Viettel Cyber Security, Viettel Group
        position: AI Engineer Intern
        location: Ha Noi, Viet Nam
        start_date: 2025-03-01
        end_date: 2026-02-28
        highlights:
          - "**EDR-SLM framework:** fine-tuned SLMs (Qwen 0.5B–8B) via Unsloth and LoRA to replace heavy LLMs in multi-agent pipelines, optimizing execution outcomes, inference latency, and VRAM footprint for NL-to-SQL translation."
          - "**Self-defending AI agent architecture:** researched multi-turn adversarial exploits (prompt injection, logic deception) to design safety-aligned agent architectures that detect malicious intent and enforce a safe execution policy during code/Bash generation."

      - company: BKAI NLP Lab, Hanoi University of Science and Technology
        position: Research Member — supervised by Assoc. Prof. Le Thanh Huong
        location: Ha Noi, Viet Nam
        start_date: 2024-09-01
        highlights:
          - "**Graduation thesis — Multi-Level Knowledge Distillation for Low-Resource NMT (grade 9.3/10):** designed a multi-level KD framework transferring capabilities from large teachers to compact students (Qwen3-1.7B, Qwen2.5-0.5B) via distribution-aware logit distillation, full-layer feature alignment, and intra-student cross-lingual contrastive learning."
          - "Resolved teacher–student vocabulary mismatch using bipartite-graph span alignment; raised the 1.7B student's chrF++ on FLORES-200 from 10.09 to 30.41 (Vi–Khm) and 6.54 to 30.86 (Vi–Lao)."
          - "**Vietnamese–Khmer NMT optimization:** developed a 3-stage pipeline (monolingual CPT → LoRA SFT → CPO) using 27K self-constructed preference triplets; surpassed Sailor2-1B, DPO, and GPT-4o-mini across BLEU, METEOR, COMET, and COMET-KIWI."

